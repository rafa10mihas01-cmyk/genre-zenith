# Stack docker isolada para os workers (Playwright + PM2 runtime).
# Use no lugar do PM2 nativo se preferir contêiner.
#
#   docker compose -f docker-compose.worker.yml up -d --build
#   docker compose -f docker-compose.worker.yml logs -f
#
# Volumes persistidos:
#   ./logs                       — logs PM2 (compartilhados com host)
#   /opt/nexengine/secrets       — spotify-session.json (gerado uma vez)

services:
  nexengine-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexengine/worker:latest
    container_name: nexengine-worker
    restart: unless-stopped
    env_file: .env
    environment:
      WORKER_COUNT: ${WORKER_COUNT:-2}
      ENABLE_SCHEDULER: "true"
      ENABLE_HEALTHCHECK: "true"
      HEALTHCHECK_PORT: "8787"
      # dentro do container o storage state vive em /opt/nexengine/secrets/spotify-session.json
      SPOTIFY_STORAGE_STATE_PATH: /opt/nexengine/secrets/spotify-session.json
    volumes:
      - ./logs:/app/logs
      - /opt/nexengine/secrets:/opt/nexengine/secrets:ro
    ports:
      - "8787:8787"     # healthcheck HTTP
    shm_size: "1gb"     # Chromium precisa de /dev/shm decente
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 4g
